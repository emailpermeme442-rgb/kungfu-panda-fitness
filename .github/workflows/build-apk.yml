name: Build Seven Fitness APK Offline

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify app source and prepare launcher icon
        run: |
          set -e
          test -f index.html || {
            echo "ERRORE: index.html non trovato nella radice del repository."
            exit 1
          }
          test -f icon.png.jpg || {
            echo "ERRORE: icon.png.jpg non trovato nella radice del repository."
            exit 1
          }

          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          source = Image.open("icon.png.jpg").convert("RGB")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              output_dir = Path("app/src/main/res") / folder
              output_dir.mkdir(parents=True, exist_ok=True)
              icon = ImageOps.fit(
                  source,
                  (size, size),
                  method=Image.Resampling.LANCZOS,
                  centering=(0.5, 0.5),
              )
              icon.save(output_dir / "ic_launcher.png", format="PNG", optimize=True)

          print("Icona launcher generata per tutte le densità Android.")
          PY

      - name: Generate Android project
        run: |
          set -e

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/it/sevenfitness/log

          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SevenFitnessLog"
          include ':app'
          EOF
