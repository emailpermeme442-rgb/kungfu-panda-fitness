name: Build Seven Fitness APK Offline

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/it/sevenfitness/log

          cp index.html app/src/main/assets/index.html
          
          # Copia l'icona se presente nella radice del repository
          if [ -f icon.png ]; then
            cp icon.png app/src/main/assets/icon.png
          fi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SevenFitnessLog"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'it.sevenfitness.log'
              compileSdk 35

              defaultConfig {
                  applicationId 'it.sevenfitness.log'
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Seven Fitness Log"
                  android:usesCleartextTraffic="false"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/it/sevenfitness/log/MainActivity.java <<'EOF'
          package it.sevenfitness.log;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.Toast;

          import java.io.OutputStream;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;
              private static final int FILE_REQUEST = 100;
              private static final int CREATE_FILE_REQUEST = 101;

              private String pendingFilename;
              private String pendingMimeType;
              private byte[] pendingData;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.addJavascriptInterface(new WebAppInterface(this), "AndroidBridge");

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView view,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params) {
                          fileCallback = callback;
                          Intent intent = params.createIntent();
                          try {
                              startActivityForResult(intent, FILE_REQUEST);
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class WebAppInterface {
                  private Activity mContext;

                  WebAppInterface(Activity c) {
                      mContext = c;
                  }

                  @JavascriptInterface
                  public void saveFile(String filename, String mimeType, String base64Data) {
                      try {
                          byte[] data = android.util.Base64.decode(base64Data, android.util.Base64.DEFAULT);

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, filename);
                              values.put(MediaStore.Downloads.MIME_TYPE, mimeType);
                              values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);

                              Uri uri = mContext.getContentResolver().insert(
                                      MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);

                              if (uri == null) {
                                  throw new Exception("Impossibile creare il file");
                              }

                              try (OutputStream out = mContext.getContentResolver().openOutputStream(uri)) {
                                  if (out == null) {
                                      throw new Exception("Impossibile aprire il flusso di scrittura");
                                  }
                                  out.write(data);
                              }

                              mContext.runOnUiThread(() ->
                                      Toast.makeText(mContext, "Salvato in Download: " + filename, Toast.LENGTH_LONG).show()
                              );

                          } else {
                              pendingFilename = filename;
                              pendingMimeType = mimeType;
                              pendingData = data;

                              mContext.runOnUiThread(() -> {
                                  Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                                  intent.setType(mimeType);
                                  intent.putExtra(Intent.EXTRA_TITLE, filename);
                                  startActivityForResult(intent, CREATE_FILE_REQUEST);
                              });
                          }

                      } catch (Exception e) {
                          mContext.runOnUiThread(() ->
                                  Toast.makeText(mContext, "Errore salvataggio: " + e.getMessage(), Toast.LENGTH_LONG).show()
                          );
                      }
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == FILE_REQUEST && fileCallback != null) {
                      Uri[] results = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                      fileCallback.onReceiveValue(results);
                      fileCallback = null;
                  } else if (requestCode == CREATE_FILE_REQUEST && resultCode == RESULT_OK) {
                      if (data != null && data.getData() != null && pendingData != null) {
                          Uri uri = data.getData();
                          try (OutputStream out = getContentResolver().openOutputStream(uri)) {
                              if (out != null) {
                                  out.write(pendingData);
                                  runOnUiThread(() ->
                                          Toast.makeText(this, "File salvato con successo!", Toast.LENGTH_LONG).show()
                                  );
                              }
                          } catch (Exception e) {
                              runOnUiThread(() ->
                                      Toast.makeText(this, "Errore scrittura file: " + e.getMessage(), Toast.LENGTH_LONG).show()
                              );
                          } finally {
                              pendingData = null;
                              pendingFilename = null;
                              pendingMimeType = null;
                          }
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Seven-Fitness-Log-APK
          path: app/build/outputs/apk/debug/app-debug.apk
